<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kitty's Ball</title>
<style>
*{box-sizing:border-box;font-family:"Comic Sans MS",Arial,sans-serif}
body{margin:0;min-height:100vh;overflow:hidden}
.bg{background:linear-gradient(90deg,#FE64E6 50%,#FEE600 50%) top/100% 50% no-repeat,linear-gradient(90deg,#5815BD 50%,#A9F5A4 50%) bottom/100% 50% no-repeat}
#home,#game{min-height:100vh}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:320px;max-width:80%}
.play,.num{border:0;border-radius:25px;font-weight:bold;cursor:pointer}
.play{margin-top:30px;padding:18px 60px;font-size:32px;color:#5815BD;background:white}
#game{display:none;padding:20px}
.card{max-width:600px;margin:auto;background:white;border-radius:35px;padding:25px;text-align:center}
#balls{min-height:200px;display:flex;justify-content:center;align-content:center;flex-wrap:wrap;gap:10px;background:#fff;border-radius:30px}
.ball{width:45px;height:45px;border-radius:50%}
.jump{animation:j .6s}
@keyframes j{50%{transform:translateY(-45px) scale(1.2)}}
.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.num{padding:15px;font-size:28px;background:#D6F0FF}
#mathPopup{display:none;position:fixed;inset:0;background:#0008;justify-content:center;align-items:center}
.box{background:white;border-radius:30px;padding:30px;text-align:center}
input{font-size:30px;width:120px;text-align:center}
.confetti{position:fixed;width:10px;height:10px;animation:f 1.5s}
@keyframes f{to{top:100vh;opacity:0}}
</style>
</head>

<button class="play" onclick="start()">▶ PLAY</button>

<div id="game" class="bg">
<div class="card">
<h1>🐱 Kitty's Ball</h1>
<h2>Level <span id="level">1</span>/20</h2>
<div id="balls"></div>
<div class="numbers" id="numbers"></div>
<h2 id="msg"></h2>
⭐ Skor <span id="score">0</span>
</div>
</div>

<div id="mathPopup">
<div class="box">
<h1>🐱 Quiz Kitty</h1>
<h2 id="question"></h2>
<input id="mathInput" type="number"><br><br>
<button class="play" onclick="checkMath()">LANJUT</button>
</div>
</div>

<script>
let level=1,score=0,total=0,ansMath=0;
let colors=["#FF9FCB","#8ED8FF","#FFE477","#B7F5C8","#CDA8FF"];

function start(){home.style.display="none";game.style.display="block";make()}
function make(){
balls.innerHTML="";numbers.innerHTML="";msg.innerHTML="";
levelText=level;document.getElementById("level").innerHTML=level;
total=Math.floor(Math.random()*6)+5;
for(let i=0;i<total;i++){let b=document.createElement("div");b.className="ball";b.style.background=colors[Math.floor(Math.random()*colors.length)];balls.appendChild(b)}
for(let i=1;i<=10;i++){let b=document.createElement("button");b.className="num";b.innerHTML=i;b.onclick=()=>check(i);numbers.appendChild(b)}
}
function check(n){
if(n==total){score++;document.getElementById("score").innerHTML=score;msg.innerHTML="🎉 Benar!";
document.querySelectorAll(".ball").forEach(x=>x.classList.add("jump"));
confetti();setTimeout(()=>level%4==0?math():next(),800)}
else msg.innerHTML="😊 Coba lagi"
}
function next(){level++;level>20?win():make()}
function math(){let a=Math.ceil(Math.random()*9),b=Math.ceil(Math.random()*9);ansMath=a+b;question.innerHTML=a+" + "+b+" = ?";mathPopup.style.display="flex"}
function checkMath(){if(Number(mathInput.value)==ansMath){mathPopup.style.display="none";mathInput.value="";next()}else{alert("Salah, kembali level 1");mathPopup.style.display="none";level=1;make()}}
function confetti(){for(let i=0;i<40;i++){let c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[Math.floor(Math.random()*colors.length)];document.body.appendChild(c);setTimeout(()=>c.remove(),1500)}}
function win(){game.innerHTML='<div class="card"><h1>🎉 Hebat!</h1><p>Selesai Level 1-20</p><button class="play" onclick="location.reload()">HOME</button></div>'}
</script>
</body>
