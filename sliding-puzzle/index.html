<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle Angka 1–8</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --dark: #383232;
      --light: #F1E2E7;
      --pink: #D74F7D;
      --blue: #7092D1;
      --ink: #000;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(
        to bottom,
        var(--dark) 0%,
        var(--dark) 38%,
        #5d5054 43%,
        #9d858d 48%,
        #d8c5cc 53%,
        var(--light) 58%,
        var(--light) 100%
      );
    }
    button, input { font: inherit; color: var(--ink); }
    button { -webkit-tap-highlight-color: transparent; }
    .dots { position: fixed; inset: 0 0 56% 0; overflow: hidden; pointer-events: none; }
    .dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      opacity: .95;
      will-change: transform;
      animation: dotBounce var(--speed, 2s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    @keyframes dotBounce {
      from { transform: translateY(calc(var(--distance, 22px) * -1)); }
      to { transform: translateY(var(--distance, 22px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation-duration: 5s; }
    }
    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .screen.active { display: flex; }
    .card {
      width: min(92vw, 470px);
      padding: 30px 26px;
      border: 4px solid var(--ink);
      border-radius: 28px;
      background: #fff;
      box-shadow: 9px 9px 0 var(--ink);
      text-align: center;
    }
    .eyebrow { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 8vw, 48px); line-height: 1.04; }
    p { margin: 8px 0 20px; font-size: 18px; line-height: 1.45; font-weight: 700; }
    .number-row { display: flex; justify-content: center; gap: 7px; margin: 20px 0 26px; flex-wrap: wrap; }
    .mini-number {
      display: grid; place-items: center; width: 38px; height: 38px;
      border: 2px solid var(--ink); border-radius: 10px; font-weight: 900;
      background: var(--blue); box-shadow: 3px 3px 0 var(--ink);
    }
    .mini-number:nth-child(even) { background: var(--pink); }
    label { display: block; margin-bottom: 8px; text-align: left; font-size: 18px; font-weight: 900; }
    input {
      width: 100%; padding: 14px 16px; border: 3px solid var(--ink); border-radius: 14px;
      background: var(--light); outline: none; font-size: 19px; font-weight: 800;
    }
    input:focus { box-shadow: 0 0 0 4px var(--blue); }
    .main-button {
      width: 100%; margin-top: 17px; padding: 14px 20px; border: 3px solid var(--ink);
      border-radius: 15px; background: var(--pink); font-size: 20px; font-weight: 900;
      box-shadow: 5px 5px 0 var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s;
    }
    .main-button:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
    .main-button:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
    .error { min-height: 23px; margin: 8px 0 -8px; color: var(--ink); font-weight: 900; }
    .game-card { padding-top: 22px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .player-badge, .move-badge {
      padding: 8px 12px; border: 2px solid var(--ink); border-radius: 999px;
      background: var(--light); font-size: 14px; font-weight: 900;
    }
    .game-card h1 { font-size: clamp(28px, 7vw, 39px); }
    .instruction { margin: 6px 0 16px; font-size: 16px; }
    .board {
      width: min(76vw, 330px); aspect-ratio: 1; margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
      padding: 10px; border: 4px solid var(--ink); border-radius: 22px;
      background: var(--dark); box-shadow: 7px 7px 0 var(--ink);
    }
    .tile {
      border: 3px solid var(--ink); border-radius: 16px; background: var(--blue);
      font-size: clamp(30px, 9vw, 46px); font-weight: 900; cursor: pointer;
      box-shadow: inset 0 -7px 0 rgba(255,255,255,.24); transition: transform .15s, background .15s;
    }
    .tile:nth-child(even) { background: var(--pink); }
    .tile:hover { transform: scale(1.04); }
    .tile.empty { visibility: hidden; cursor: default; }
    .status { min-height: 27px; margin: 16px 0 0; font-size: 17px; font-weight: 900; }
    .shuffle { background: var(--blue); }
    .finish-icon { font-size: 76px; line-height: 1; margin-bottom: 12px; }
    .finish-card h1 { font-size: clamp(34px, 8vw, 48px); }
    @media (max-width: 380px) {
      .screen { padding: 14px; }
      .card { padding: 23px 17px; }
      .board { gap: 6px; padding: 7px; }
      .tile { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <section class="screen active" id="startScreen">
    <main class="card">
      <p class="eyebrow">GAME EDUKASI</p>
      <h1>Sliding Puzzle Angka</h1>
      <p>Geser angka sampai urut dari 1 sampai 8!</p>
      <div class="number-row" aria-hidden="true">
        <span class="mini-number">1</span><span class="mini-number">2</span>
        <span class="mini-number">3</span><span class="mini-number">4</span>
        <span class="mini-number">5</span><span class="mini-number">6</span>
        <span class="mini-number">7</span><span class="mini-number">8</span>
      </div>
      <label for="playerName">Nama pemain</label>
      <input id="playerName" type="text" maxlength="20" autocomplete="off" placeholder="Tulis namamu di sini">
      <div class="error" id="nameError" role="alert"></div>
      <button class="main-button" id="playButton">PLAY</button>
    </main>
  </section>

  <section class="screen" id="gameScreen">
    <main class="card game-card">
      <div class="topbar">
        <span class="player-badge" id="playerBadge">Pemain</span>
        <span class="move-badge">Langkah: <b id="moveCount">0</b></span>
      </div>
      <h1>Urutkan 1–8</h1>
      <p class="instruction">Tap angka di sebelah kotak kosong untuk menggesernya.</p>
      <div class="board" id="board" aria-label="Papan sliding puzzle"></div>
      <div class="status" id="gameStatus" aria-live="polite"></div>
      <button class="main-button shuffle" id="shuffleButton">ACAK ULANG</button>
    </main>
  </section>

  <section class="screen" id="finishScreen">
    <main class="card finish-card">
      <div class="finish-icon">🎉</div>
      <p class="eyebrow">HEBAT!</p>
      <h1>Puzzle Selesai!</h1>
      <p id="finishMessage">Semua angka sudah berurutan.</p>
      <button class="main-button" id="homeButton">KEMBALI KE HALAMAN PERTAMA</button>
    </main>
  </section>

  <script>
    const solved = [1, 2, 3, 4, 5, 6, 7, 8, 0];
    let tiles = [...solved];
    let moves = 0;
    let player = '';

    const screens = document.querySelectorAll('.screen');
    const board = document.getElementById('board');
    const moveCount = document.getElementById('moveCount');
    const gameStatus = document.getElementById('gameStatus');

    function makeDots() {
      const wrap = document.getElementById('dots');
      for (let i = 0; i < 75; i++) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        const size = 4 + Math.random() * 8;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.background = i % 3 === 0 ? '#D74F7D' : '#7092D1';
        dot.style.setProperty('--speed', (1.1 + Math.random() * 1.5).toFixed(2) + 's');
        dot.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
        dot.style.setProperty('--distance', (14 + Math.random() * 28).toFixed(0) + 'px');
        wrap.appendChild(dot);
      }
    }

    function showScreen(id) {
      screens.forEach(screen => screen.classList.toggle('active', screen.id === id));
    }

    function neighbors(index) {
      const row = Math.floor(index / 3);
      const col = index % 3;
      const list = [];
      if (row > 0) list.push(index - 3);
      if (row < 2) list.push(index + 3);
      if (col > 0) list.push(index - 1);
      if (col < 2) list.push(index + 1);
      return list;
    }

    function shufflePuzzle() {
      tiles = [...solved];
      let previousBlank = -1;
      for (let i = 0; i < 160; i++) {
        const blank = tiles.indexOf(0);
        let choices = neighbors(blank).filter(index => index !== previousBlank);
        if (!choices.length) choices = neighbors(blank);
        const chosen = choices[Math.floor(Math.random() * choices.length)];
        previousBlank = blank;
        [tiles[blank], tiles[chosen]] = [tiles[chosen], tiles[blank]];
      }
      if (isSolved()) return shufflePuzzle();
      moves = 0;
      moveCount.textContent = '0';
      gameStatus.textContent = 'Ayo, kamu pasti bisa!';
      renderBoard();
    }

    function renderBoard() {
      board.innerHTML = '';
      tiles.forEach((number, index) => {
        const button = document.createElement('button');
        button.className = 'tile' + (number === 0 ? ' empty' : '');
        button.textContent = number || '';
        button.setAttribute('aria-label', number === 0 ? 'Kotak kosong' : 'Angka ' + number);
        button.disabled = number === 0;
        if (number !== 0) button.addEventListener('click', () => moveTile(index));
        board.appendChild(button);
      });
    }

    function moveTile(index) {
      const blank = tiles.indexOf(0);
      if (!neighbors(blank).includes(index)) {
        gameStatus.textContent = 'Pilih angka yang tepat di sebelah kotak kosong.';
        return;
      }
      [tiles[blank], tiles[index]] = [tiles[index], tiles[blank]];
      moves++;
      moveCount.textContent = moves;
      gameStatus.textContent = 'Bagus! Lanjutkan.';
      renderBoard();
      if (isSolved()) {
        setTimeout(() => {
          document.getElementById('finishMessage').textContent =
            'Selamat, ' + player + '! Kamu menyelesaikannya dalam ' + moves + ' langkah.';
          showScreen('finishScreen');
        }, 350);
      }
    }

    function isSolved() {
      return tiles.every((value, index) => value === solved[index]);
    }

    document.getElementById('playButton').addEventListener('click', () => {
      const input = document.getElementById('playerName');
      player = input.value.trim();
      if (!player) {
        document.getElementById('nameError').textContent = 'Isi nama dulu, ya!';
        input.focus();
        return;
      }
      document.getElementById('nameError').textContent = '';
      document.getElementById('playerBadge').textContent = player;
      shufflePuzzle();
      showScreen('gameScreen');
    });

    document.getElementById('playerName').addEventListener('keydown', event => {
      if (event.key === 'Enter') document.getElementById('playButton').click();
    });
    document.getElementById('shuffleButton').addEventListener('click', shufflePuzzle);
    document.getElementById('homeButton').addEventListener('click', () => {
      document.getElementById('playerName').value = '';
      document.getElementById('nameError').textContent = '';
      showScreen('startScreen');
      setTimeout(() => document.getElementById('playerName').focus(), 100);
    });

    makeDots();
    renderBoard();
  </script>
</body>
</html>
