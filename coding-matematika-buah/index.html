<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coding Matematika Buah</title>
<style>
body{
margin:0;min-height:100vh;
background:
radial-gradient(circle,#da1bfe 3px,transparent 4px),
linear-gradient(135deg,#ffd6eb,#ffffff);
background-size:45px 45px,100% 100%;
animation:bg 8s linear infinite;
font-family:Arial;
display:flex;justify-content:center;align-items:center
}
@keyframes bg{to{background-position:45px 45px,0 0}}
.container{
width:950px;background:white;border:4px solid #222;
border-radius:30px;padding:30px;text-align:center;
box-shadow:8px 8px #222
}
.hide{display:none}
button{
padding:12px 25px;margin:8px;border:3px solid #222;
border-radius:15px;background:#F9692A;color:white;
font-weight:bold;cursor:pointer
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.grid button{background:#f5b4dc;color:#222}
table{border-collapse:collapse;margin:auto}
td{border:2px solid #222;width:70px;height:60px;font-size:30px}
.box{
border:3px solid #da1bfe;border-radius:15px;
padding:20px;margin:15px;font-size:28px
}
input{width:55px;height:38px;font-size:22px;text-align:center}
.wrong{background:#ffcaca;border:3px solid red}
.correct{background:#caffca;border:3px solid green}
.error{color:red;font-size:30px;font-weight:bold}
</style>
</head>
<body>

<div class="container">

<div id="home">
<h1>🍎 CODING MATEMATIKA BUAH 🍎</h1>
<p>Gunakan kode buah untuk menjawab.</p>
<button onclick="startGame()">Mulai</button>
<button onclick="openLevel()">Pilih Level</button>
</div>

<div id="levelPage" class="hide">
<h1>Pilih Level</h1>
<div id="levels" class="grid"></div>
<button onclick="resetGame()">Reset</button>
<button onclick="home()">Return</button>
</div>

<div id="game" class="hide">
<button onclick="home()">Return</button>
<h1 id="title"></h1>

<table>
<tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
<tr><td>🍎</td><td>🍊</td><td>🍌</td><td>🍇</td><td>🍉</td><td>🍓</td><td>🍍</td><td>🥝</td><td>🍒</td></tr>
</table>

<div id="question"></div>
<button onclick="check()">Periksa</button>
<button id="next" class="hide" onclick="nextLevel()">Next</button>
<div id="msg"></div>
</div>

</div>

<script>

function generateQuestion(level){
    let count;
    if(level<=2) count=1;
    else if(level<=5) count=2;
    else if(level<=7) count=3;
    else count=4;

    let nums=[];
    let ops=[];

    while(nums.length<count+1){
        let n=Math.floor(Math.random()*9)+1;
        if(!nums.includes(n)) nums.push(n);
    }

    for(let i=0;i<count;i++){
        ops.push(Math.random()>0.5?"+":"-");
    }

    // Hindari hasil negatif
    let result=nums[0];
    for(let i=0;i<ops.length;i++){
        if(ops[i]=="+"){
            result+=nums[i+1];
        }else{
            if(result-nums[i+1]<0){
                ops[i]="+";
                result+=nums[i+1];
            }else{
                result-=nums[i+1];
            }
        }
    }

    let expression=[nums[0]];
    for(let i=0;i<ops.length;i++){
        expression.push(ops[i]);
        expression.push(nums[i+1]);
    }

    return expression;
}

let unlocked=1;
let current=1;

const buah=["🍎","🍊","🍌","🍇","🍉","🍓","🍍","🥝","🍒"];

/*
format:
angka,operator,angka,operator,angka...
*/
const data=[
[1,"+",2],
[1,"+",2,"-",3],
[5,"-",6,"+",4],
[1,"+",2,"-",3,"+",4],
[5,"-",6,"+",7,"-",8],
[9,"-",2,"+",4,"-",6],
[3,"+",5,"-",7,"+",8],
[1,"+",9,"-",4,"+",6],
[8,"-",5,"+",2,"-",3,"+",1],
[5,"-",6,"+",4,"-",9,"+",2]
];

function hideAll(){
document.getElementById("home").classList.add("hide");
document.getElementById("levelPage").classList.add("hide");
document.getElementById("game").classList.add("hide");
}

function home(){
hideAll();
document.getElementById("home").classList.remove("hide");
}

function startGame(){
play(1);
}

function openLevel(){
hideAll();
document.getElementById("levelPage").classList.remove("hide");

let box=document.getElementById("levels");
box.innerHTML="";

for(let i=1;i<=10;i++){
let b=document.createElement("button");
b.innerHTML="Level "+i+(i>unlocked?" 🔒":"");
if(i<=unlocked){
b.onclick=function(){play(i)};
}
box.appendChild(b);
}
}

function resetGame(){
unlocked=1;
openLevel();
}

function play(level){
current=level;
hideAll();
document.getElementById("game").classList.remove("hide");
document.getElementById("title").innerHTML="Level "+level;

let exp=generateQuestion(level);

let soal="";
let jawaban=[];
let hasil=exp[0];

soal+=buah[exp[0]-1];
jawaban.push(exp[0]);

for(let i=1;i<exp.length;i+=2){
let operator=exp[i];
let angka=exp[i+1];

soal+=" "+operator+" "+buah[angka-1];
jawaban.push(angka);

if(operator==="+"){
hasil+=angka;
}else{
hasil-=angka;
}
}

jawaban.push(hasil);

let input="";
for(let i=0;i<jawaban.length-1;i++){
input+='<input data-answer="'+jawaban[i]+'">';
if(i<jawaban.length-2){
input+=" "+exp[(i*2)+1]+" ";
}
}
input+=" = <input data-answer='"+jawaban[jawaban.length-1]+"'>";

document.getElementById("question").innerHTML=
'<div class="box">'+soal+' = ?<br><br>'+input+'</div>';

document.getElementById("next").classList.add("hide");
document.getElementById("msg").innerHTML="";
}

function check(){
let benar=true;

document.querySelectorAll("#question input").forEach(i=>{
if(Number(i.value)!==Number(i.dataset.answer)){
i.className="wrong";
benar=false;
}else{
i.className="correct";
}
});

if(benar){
document.getElementById("msg").innerHTML="🎉 Benar!";
if(current===unlocked && unlocked<10) unlocked++;
document.getElementById("next").classList.remove("hide");
}else{
document.getElementById("msg").innerHTML='<div class="error">! Jawaban salah</div>';
}
}

function nextLevel(){
if(current<10){
play(current+1);
}else{
home();
}
}
</script>

</body>
<!-- FINAL VERSION: fruit theme, 10 levels, reset-ready -->
</html>
