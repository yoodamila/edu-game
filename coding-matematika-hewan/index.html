<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coding Hewan Matematika</title>
<style>
body{
margin:0;min-height:100vh;
background-color:#506fa8;
background-image:radial-gradient(white 2px,transparent 3px);
background-size:40px 40px;
animation:starsMove 8s linear infinite;
font-family:Arial,sans-serif;
display:flex;justify-content:center;align-items:center
}

@keyframes starsMove{
from{
background-position:0 0;
}
to{
background-position:40px 40px;
}
}
.app{
width:950px;background:#fff;border:4px solid #222;
border-radius:30px;padding:30px;text-align:center
}
.hidden{display:none}
button{
padding:12px 25px;margin:8px;
border:3px solid #222;border-radius:15px;
background:#F9692A;color:white;font-weight:bold;
cursor:pointer;font-size:18px
}
.levelGrid{
display:grid;grid-template-columns:repeat(5,1fr);gap:10px
}
.levelGrid button{background:#B4C8FF;color:#222}
table{border-collapse:collapse;margin:auto}
td{border:2px solid #222;width:65px;height:55px;font-size:30px}
.questions{
display:grid;grid-template-columns:1fr 1fr;gap:15px
}
.box{
border:3px solid #4d8cff;border-radius:15px;
padding:15px;font-size:28px;background:white
}
input{
width:55px;height:35px;font-size:22px;text-align:center
}
.wrong{background:#ffc0c0;border:3px solid red}
.correct{background:#caffca;border:3px solid green}
.error{color:red;font-size:30px;font-weight:bold}
</style>
</head>

<body>
<div class="app">

<div id="homePage">
<h1>🐾 CODING HEWAN MATEMATIKA 🐾</h1>
<p>Gunakan kode hewan untuk menyelesaikan operasi matematika.</p>
<h2>⭐ 🐶 🐱 ⭐</h2>
<button onclick="startGame()">Mulai</button>
<button onclick="openLevels()">Pilih Level</button>
</div>

<div id="levelPage" class="hidden">
<h1>Pilih Level</h1>
<div id="levelButtons" class="levelGrid"></div>
<button onclick="resetGame()">Reset</button>
<button onclick="goHome()">Return</button>
</div>

<div id="gamePage" class="hidden">
<button onclick="goHome()">Return</button>
<h1 id="levelTitle"></h1>

<table>
<tr>
<td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td>
</tr>
<tr>
<td>🐶</td><td>🐱</td><td>🐭</td><td>🐰</td><td>🦊</td><td>🐻</td><td>🐼</td><td>🐸</td><td>🦁</td>
</tr>
</table>

<div id="questionBox" class="questions"></div>

<button onclick="checkAnswer()">Periksa</button>
<button id="nextButton" class="hidden" onclick="nextLevel()">Next</button>
<div id="result"></div>
</div>

</div>

<script>
let unlockedLevel=1;
let currentLevel=1;

const animals=["🐶","🐱","🐭","🐰","🦊","🐻","🐼","🐸","🦁"];

const levelData=[
[[2,1,"+"],[4,5,"+"],[3,6,"+"],[9,8,"-"]],
[[7,2,"-"],[1,3,"+"],[6,4,"+"],[9,5,"-"]],
[[5,2,"+"],[8,3,"-"],[4,6,"+"],[9,1,"-"]],
[[3,7,"+"],[8,5,"-"],[2,6,"+"],[9,4,"-"]],
[[1,8,"+"],[6,2,"-"],[5,3,"+"],[7,4,"-"]],
[[4,5,"+"],[9,7,"-"],[3,8,"+"],[6,1,"-"]],
[[2,9,"+"],[8,6,"-"],[5,4,"+"],[7,3,"-"]],
[[1,6,"+"],[9,8,"-"],[2,5,"+"],[4,3,"-"]],
[[3,5,"+"],[7,1,"-"],[6,8,"+"],[9,2,"-"]],
[[4,6,"+"],[8,7,"-"],[5,1,"+"],[9,3,"-"]]
];

function hideAll(){
document.getElementById("homePage").classList.add("hidden");
document.getElementById("levelPage").classList.add("hidden");
document.getElementById("gamePage").classList.add("hidden");
}

function goHome(){
hideAll();
document.getElementById("homePage").classList.remove("hidden");
}

function startGame(){
loadGame(1);
}

function openLevels(){
hideAll();
document.getElementById("levelPage").classList.remove("hidden");

let area=document.getElementById("levelButtons");
area.innerHTML="";

for(let i=1;i<=10;i++){
let btn=document.createElement("button");
btn.innerHTML="Level "+i+(i>unlockedLevel?" 🔒":"");

if(i<=unlockedLevel){
btn.onclick=function(){loadGame(i);}
}else{
btn.disabled=true;
}
area.appendChild(btn);
}
}

function resetGame(){
unlockedLevel=1;
openLevels();
}

function loadGame(level){
currentLevel=level;
hideAll();
document.getElementById("gamePage").classList.remove("hidden");
document.getElementById("levelTitle").innerHTML="Level "+level;

let area=document.getElementById("questionBox");
area.innerHTML="";

let questions = [...levelData[level-1]];

// acak urutan soal setiap kali level dibuka
questions.sort(()=>Math.random()-0.5);

// acak posisi operasi dan pasangan angka tanpa mengubah jawaban
questions = questions.map(q=>{
let a=q[0],b=q[1],op=q[2];
if(Math.random()>0.5){
let temp=a;
a=b;
b=temp;
}
return [a,b,op];
});

questions.forEach(q=>{
let a=q[0],b=q[1],op=q[2];
let result=op==="+"?a+b:a-b;

area.innerHTML+=`
<div class="box">
${animals[a-1]} ${op} ${animals[b-1]} = ?
<br><br>
<input data-answer="${a}">
<span>${op}</span>
<input data-answer="${b}">
=
<input data-answer="${result}">
</div>`;
});

document.getElementById("nextButton").classList.add("hidden");
document.getElementById("result").innerHTML="";
}

function checkAnswer(){
let correct=true;

document.querySelectorAll(".box").forEach(box=>{
box.querySelectorAll("input").forEach(input=>{
if(Number(input.value)!==Number(input.dataset.answer)){
input.className="wrong";
correct=false;
}else{
input.className="correct";
}
});
});

if(correct){
document.getElementById("result").innerHTML="🎉 Semua benar!";
if(currentLevel===unlockedLevel && unlockedLevel<10){
unlockedLevel++;
}
document.getElementById("nextButton").classList.remove("hidden");
}else{
document.getElementById("result").innerHTML='<div class="error">! Jawaban salah</div>';
}
}

function nextLevel(){
if(currentLevel<10){
loadGame(currentLevel+1);
}else{
goHome();
}
}
</script>
</body>
</html>
