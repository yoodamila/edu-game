<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coding Matematika 10 Level</title>
<style>
body{margin:0;background:linear-gradient(135deg,#ED42DE,#C6E201);font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.app{width:950px;background:#fff8ed;border:4px solid #222;border-radius:30px;padding:30px;text-align:center}
button{padding:12px 25px;margin:8px;border:3px solid #222;border-radius:15px;background:#F9692A;color:white;font-weight:bold;cursor:pointer}
.hidden{display:none}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
table{border-collapse:collapse;margin:auto}
td{border:2px solid #222;width:65px;height:55px;font-size:28px}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.box{border:3px solid orange;border-radius:15px;padding:15px;font-size:28px}
input{width:55px;height:35px;font-size:22px;text-align:center}
.wrong{background:#ffcaca;border:3px solid red}
.correct{background:#caffca;border:3px solid green}
.error{color:red;font-size:30px;font-weight:bold}
</style>
</head>
<body>
<div class="app">

<div id="home">
<h1>CODING MATEMATIKA</h1>
<button onclick="start()">Mulai</button>
<button onclick="levels()">Pilih Level</button>
</div>

<div id="levelsPage" class="hidden">
<h1>Pilih Level</h1>
<div id="levelList" class="levels"></div>
<button onclick="resetGame()">Reset</button>
<button onclick="home()">Return</button>
</div>

<div id="game" class="hidden">
<button onclick="home()">Return</button>
<h1 id="title"></h1>
<table>
<tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
<tr><td>☂️</td><td>🪣</td><td>🥄</td><td>🧥</td><td>🧣</td><td>⚽</td><td>🚿</td><td>🧺</td><td>🦆</td></tr>
</table>
<div id="questions" class="questions"></div>
<button onclick="check()">Periksa</button>
<button id="next" class="hidden" onclick="next()">Next</button>
<div id="msg"></div>
</div>

</div>

<script>
let opened=1,current=1;
const icon=["☂️","🪣","🥄","🧥","🧣","⚽","🚿","🧺","🦆"];
const data=[
[[2,1,"+"],[4,5,"+"],[3,6,"+"],[9,8,"-"]],
[[7,2,"-"],[1,3,"+"],[6,4,"+"],[9,5,"-"]],
[[5,2,"+"],[8,3,"-"],[4,6,"+"],[9,1,"-"]],
[[3,7,"+"],[8,5,"-"],[2,6,"+"],[9,4,"-"]],
[[1,8,"+"],[6,2,"-"],[5,3,"+"],[7,4,"-"]],
[[4,5,"+"],[9,7,"-"],[3,8,"+"],[6,1,"-"]],
[[2,9,"+"],[8,6,"-"],[5,4,"+"],[7,3,"-"]],
[[1,6,"+"],[9,8,"-"],[2,5,"+"],[4,3,"-"]],
[[3,5,"+"],[7,1,"-"],[6,8,"+"],[9,2,"-"]],
[[4,6,"+"],[8,7,"-"],[5,1,"+"],[9,3,"-"]]
];

function hideAll(){homeDiv.classList.add("hidden");levelsPage.classList.add("hidden");gameDiv.classList.add("hidden")}
let homeDiv=document.getElementById("home"),levelsPage=document.getElementById("levelsPage"),gameDiv=document.getElementById("game");

function home(){hideAll();homeDiv.classList.remove("hidden")}
function start(){play(1)}
function levels(){hideAll();levelsPage.classList.remove("hidden");let l=document.getElementById("levelList");l.innerHTML="";
for(let i=1;i<=10;i++){let b=document.createElement("button");b.innerHTML="Level "+i+(i>opened?" 🔒":"");if(i<=opened)b.onclick=()=>play(i);else b.disabled=true;l.appendChild(b)}}
function resetGame(){opened=1;levels()}

function play(n){
current=n;hideAll();gameDiv.classList.remove("hidden");document.getElementById("title").innerHTML="Level "+n;
let q=document.getElementById("questions");q.innerHTML="";
data[n-1].forEach(a=>{
let x=a[0],y=a[1],op=a[2];
let ans=op=="+"?x+y:x-y;
q.innerHTML+=`
<div class="box">
${icon[x-1]} ${op} ${icon[y-1]} = ?
<br><br>
<input data-value="${x}">
<span style="font-weight:bold;font-size:30px">${op}</span>
<input data-value="${y}">
<span style="font-weight:bold;font-size:30px">=</span>
<input data-value="${ans}">
</div>`;
});
document.getElementById("next").classList.add("hidden");document.getElementById("msg").innerHTML="";
}

function check(){
let ok=true;
document.querySelectorAll(".box").forEach(b=>{
let inputs=b.querySelectorAll("input");
inputs.forEach(i=>{if(Number(i.value)!=Number(i.dataset.value)){ok=false;i.className="wrong"}else{i.className="correct"}});
});
if(ok){document.getElementById("msg").innerHTML="🎉 Semua benar";if(current==opened&&opened<10)opened++;document.getElementById("next").classList.remove("hidden")}
else document.getElementById("msg").innerHTML='<div class="error">! Jawaban salah</div>';
}
function next(){if(current<10)play(current+1);else home()}
</script>
</body>
</html>
