<title>Maze Kelinci ke Wortel</title>
<style>
*{box-sizing:border-box;font-family:"Comic Sans MS",sans-serif}
body{
margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#C3BDF8,#FFFFFF,#FBD738);
color:#373824;overflow:hidden;transition:.5s
}
body.playing{background:#262626;color:white}
.game{text-align:center;width:95vw;max-width:650px;position:relative;z-index:2}
.logo{width:720px;max-width:95%;margin-bottom:25px}
button{
background:#FBD738;border:0;border-radius:30px;padding:15px 45px;
font-size:25px;font-weight:bold;color:#373824;cursor:pointer
}
#maze{display:grid;gap:3px;margin:20px auto;width:min(90vw,450px);aspect-ratio:1}
.cell{display:flex;justify-content:center;align-items:center;border-radius:8px;font-size:30px}
.wall{background:#FBD738}
.path{background:white}
.controls{display:grid;grid-template-columns:65px 65px 65px;gap:8px;justify-content:center}
.controls button{padding:8px;font-size:25px}
.star{
position:fixed;font-size:25px;z-index:0;
animation:twinkle 2s infinite alternate
}
@keyframes twinkle{from{opacity:.4}to{opacity:1}}
.confetti{position:fixed;top:-20px;font-size:32px;animation:fall 2s linear}
@keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}
</style>

let s=document.createElement("div");
s.className="star";
s.innerHTML="★";
s.style.color=i%2==0?"#C3BDF8":"#FBD738";
s.style.left=Math.random()*95+"vw";
s.style.top=Math.random()*95+"vh";
s.style.transform="rotate("+Math.random()*360+"deg)";
stars.appendChild(s);
}
}

function start(){
document.body.classList.add("playing");
createStars();
home.style.display="none";
game.style.display="block";
idx=0;
load();
}

function load(){
map=levels[idx];
size=map.length;
for(let yy=0;yy<size;yy++){
for(let xx=0;xx<size;xx++){
if(map[yy][xx]=="S"){x=xx;y=yy}
}
}
level.innerHTML="Level "+(idx+1)+" / 5";
draw();
}

function draw(){
maze.innerHTML="";
maze.style.gridTemplateColumns=`repeat(${size},1fr)`;
for(let yy=0;yy<size;yy++){
for(let xx=0;xx<size;xx++){
let c=document.createElement("div");
c.className="cell "+(map[yy][xx]=="#"? "wall":"path");
if(xx==x&&yy==y)c.innerHTML="🐰";
if(map[yy][xx]=="F")c.innerHTML="🥕";
maze.appendChild(c);
}
}
}

function move(dx,dy){
let nx=x+dx,ny=y+dy;
if(nx<0||ny<0||nx>=size||ny>=size||map[ny][nx]=="#")return;
x=nx;y=ny;draw();
if(map[y][x]=="F")win();
}

function win(){
for(let i=0;i<30;i++){
let c=document.createElement("div");
c.className="confetti";
c.innerHTML=["🎉","⭐","🥕"][Math.floor(Math.random()*3)];
c.style.left=Math.random()*100+"vw";
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
setTimeout(()=>{
idx++;
if(idx<levels.length)load();
else{
game.style.display="none";
home.style.display="block";
document.body.classList.remove("playing");
stars.innerHTML="";
}
},1500);
}

document.addEventListener("keydown",e=>{
if(e.key=="ArrowUp")move(0,-1);
if(e.key=="ArrowDown")move(0,1);
if(e.key=="ArrowLeft")move(-1,0);
if(e.key=="ArrowRight")move(1,0);
});
</script>
</body>
</html>
