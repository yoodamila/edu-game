<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Hitung Jari Tangan</title>
  <style>
    :root{--bg:#F5F5F5;--yellow:#EFED3B;--pink:#FDCEFE;--ink:#373824;--skin:#F5C9A9;--skin2:#EAB18C;--white:#fff}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;overflow-x:hidden}
    button,input{font:inherit;color:var(--ink)}
    button{border:0;cursor:pointer;touch-action:manipulation}
    .screen{display:none;min-height:100vh;padding:24px;position:relative;overflow:hidden}
    .screen.active{display:flex;align-items:center;justify-content:center}
    .squiggle-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .squiggle{position:absolute;width:110px;height:46px;pointer-events:none;opacity:.76;animation:float 5s ease-in-out infinite}
    .squiggle path{fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .squiggle.pink path{stroke:var(--pink)}
    .squiggle.yellow path{stroke:var(--yellow)}
    @keyframes float{50%{translate:0 13px;rotate:4deg}}
    .card{position:relative;z-index:2;width:min(92vw,560px);background:rgba(255,255,255,.92);border:4px solid var(--ink);border-radius:32px;padding:32px 26px;text-align:center;box-shadow:9px 9px 0 var(--pink)}
    h1{font-size:clamp(34px,8vw,58px);line-height:1;margin:12px 0 10px}
    .subtitle{font-size:clamp(18px,4vw,23px);line-height:1.4;margin:0 auto 25px;max-width:420px}
    .mini-hand{font-size:82px;display:block;animation:hello 1.25s ease-in-out infinite;transform-origin:70% 80%}
    .hero-logo{display:block;width:min(58vw,230px);height:190px;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 7px 0 rgba(55,56,36,.12))}
    @keyframes hello{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(15deg)}}
    label{display:block;font-size:20px;margin-bottom:9px}
    input{width:100%;max-width:360px;padding:15px 18px;border:3px solid var(--ink);border-radius:18px;background:var(--bg);outline:none;text-align:center;font-size:22px}
    input:focus{box-shadow:0 0 0 5px var(--pink)}
    .primary{display:block;margin:22px auto 0;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:14px 42px;font-size:25px;font-weight:900;box-shadow:0 6px 0 var(--ink);transition:.12s}
    .primary:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
    .game-wrap{position:relative;z-index:2;width:min(94vw,700px);text-align:center}
    .topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px;font-weight:900}
    .pill{background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:9px 15px;box-shadow:3px 3px 0 var(--pink)}
    .question{font-size:clamp(25px,6vw,38px);margin:15px 0 4px}
    .hand-stage{height:300px;display:flex;align-items:center;justify-content:center}
    .hand{position:relative;width:245px;height:250px;transform-origin:50% 90%}
    .hand.wave{animation:wave .55s ease-in-out 2}
    @keyframes wave{0%,100%{transform:rotate(0) scale(1)}35%{transform:rotate(-10deg) scale(1.04)}70%{transform:rotate(10deg) scale(1.04)}}
    .palm{position:absolute;left:57px;bottom:18px;width:145px;height:145px;background:var(--skin);border:5px solid var(--ink);border-radius:55px 55px 65px 65px;z-index:3}
    .wrist{position:absolute;left:87px;bottom:-5px;width:95px;height:80px;background:var(--skin);border:5px solid var(--ink);border-top:0;border-radius:0 0 25px 25px;z-index:2}
    .finger{position:absolute;background:var(--skin);border:5px solid var(--ink);border-radius:30px 30px 20px 20px;transform-origin:50% 100%;transition:.45s cubic-bezier(.2,.9,.3,1);z-index:2}
    .finger.down{transform:translateY(93px) scaleY(.45);opacity:.22}
    .f1{width:43px;height:140px;left:55px;top:20px}.f2{width:45px;height:175px;left:94px;top:-12px}.f3{width:45px;height:160px;left:135px;top:2px}.f4{width:43px;height:133px;left:175px;top:29px}
    .thumb{width:48px;height:112px;left:23px;top:112px;transform:rotate(-46deg);z-index:4}
    .thumb.down{transform:rotate(-46deg) translateY(70px) scaleY(.5)}
    .shine{position:absolute;width:13px;height:32px;background:rgba(255,255,255,.36);border-radius:20px;left:12px;top:14px}
    .answers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:2px auto 0;max-width:620px}
    .answer{aspect-ratio:1;background:var(--pink);border:4px solid var(--ink);border-radius:22px;font-size:clamp(30px,7vw,50px);font-weight:900;box-shadow:0 6px 0 var(--ink);transition:.12s}
    .answer:nth-child(even){background:var(--yellow)}
    .answer:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
    .answer.correct{background:#A9ED8C;animation:pop .35s ease}
    .answer.wrong{background:#FFB6B6;animation:shake .3s ease}
    @keyframes pop{50%{transform:scale(1.14)}}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .feedback{height:34px;margin:13px 0 0;font-size:24px;font-weight:900}
    .stars{font-size:50px;letter-spacing:7px;margin:15px 0}
    @media(max-width:520px){.screen{padding:15px}.card{padding:25px 18px}.hand-stage{height:265px;transform:scale(.9);margin:-8px 0}.answers{gap:7px}.answer{border-width:3px;border-radius:17px}.topbar{font-size:15px}.pill{padding:7px 11px}.question{margin-top:10px}}
  </style>
</head>

      <h1>Hitung Jari!</h1>
      <p class="subtitle">Lihat jari yang terangkat, lalu pilih angka yang benar.</p>
      <label for="name">Siapa namamu?</label>
      <input id="name" type="text" maxlength="18" placeholder="Tulis nama di sini" autocomplete="off">
      <button id="play" class="primary">PLAY ▶</button>
    </main>
  </section>

  <section id="game" class="screen">
    <div class="squiggle-layer" aria-hidden="true"></div>
    <main class="game-wrap">
      <div class="topbar"><span id="player" class="pill">Pemain</span><span id="score" class="pill">⭐ 0</span><span id="round" class="pill">1 / 10</span></div>
      <h2 class="question">Ada berapa jari?</h2>
      <div class="hand-stage">
        <div id="hand" class="hand" aria-label="Tangan kartun">
          <div class="finger f1"><i class="shine"></i></div><div class="finger f2"><i class="shine"></i></div><div class="finger f3"><i class="shine"></i></div><div class="finger f4"><i class="shine"></i></div><div class="finger thumb"><i class="shine"></i></div>
          <div class="palm"></div><div class="wrist"></div>
        </div>
      </div>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </main>
  </section>

  <section id="finish" class="screen">
    <div class="squiggle-layer" aria-hidden="true"></div>
    <main class="card">
      <span class="mini-hand">🙌</span><h1>Hebat!</h1>
      <p id="result" class="subtitle"></p><div class="stars">⭐ ⭐ ⭐</div>
      <button id="again" class="primary">MAIN LAGI ↻</button>
    </main>
  </section>

  <script>
    const screens={start:document.querySelector('#start'),game:document.querySelector('#game'),finish:document.querySelector('#finish')};
    const hand=document.querySelector('#hand'), fingers=[...document.querySelectorAll('.finger')], answers=document.querySelector('#answers'), feedback=document.querySelector('#feedback');
    let target=1, round=1, score=0, locked=false, playerName='Teman';
    const spots=[[2,3],[25,2],[50,4],[75,2],[88,12],[4,20],[82,27],[13,35],[70,38],[1,48],[87,49],[8,63],[76,61],[23,72],[57,70],[89,78],[3,88],[37,89],[65,87],[82,93]];
    document.querySelectorAll('.squiggle-layer').forEach((layer,screenIndex)=>{
      spots.forEach(([x,y],i)=>{
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('viewBox','0 0 180 75');svg.classList.add('squiggle',(i+screenIndex)%2?'pink':'yellow');
        svg.style.left=x+'%';svg.style.top=y+'%';svg.style.width=(75+(i%4)*18)+'px';svg.style.transform='rotate('+(-28+(i*17)%58)+'deg)';svg.style.animationDelay=(-(i%6)*.55)+'s';
        svg.innerHTML='<path d="M5 43 C25 5 48 70 70 34 S113 5 133 42 S158 67 176 30"/>';layer.appendChild(svg);
      });
    });
    const show=id=>{Object.values(screens).forEach(s=>s.classList.remove('active'));screens[id].classList.add('active')};
    function tone(freq,duration=.13){try{const C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);o.start();o.stop(a.currentTime+duration)}catch(e){}}
    function newQuestion(){
      locked=false;feedback.textContent='';hand.classList.remove('wave');
      target=Math.floor(Math.random()*5)+1;
      fingers.forEach((f,i)=>f.classList.toggle('down',i>=target));
      answers.innerHTML='';
      [1,2,3,4,5].sort(()=>Math.random()-.5).forEach(n=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.setAttribute('aria-label','Angka '+n);b.onclick=()=>choose(n,b);answers.appendChild(b)});
      document.querySelector('#score').textContent='⭐ '+score;document.querySelector('#round').textContent=round+' / 10';
    }
    function choose(n,button){
      if(locked)return;
      if(n===target){locked=true;score+=10;button.classList.add('correct');feedback.textContent='Benar! Pintar! 🎉';hand.classList.add('wave');tone(660);setTimeout(()=>tone(880),130);setTimeout(()=>{if(round>=10)finish();else{round++;newQuestion()}},1100)}
      else{button.classList.add('wrong');feedback.textContent='Coba hitung lagi 😊';tone(210,.18);setTimeout(()=>button.classList.remove('wrong'),350)}
    }
    function startGame(){playerName=document.querySelector('#name').value.trim()||'Teman';round=1;score=0;document.querySelector('#player').textContent='👋 '+playerName;show('game');newQuestion()}
    function finish(){document.querySelector('#result').textContent=playerName+' berhasil mendapat '+score+' bintang poin!';show('finish')}
    document.querySelector('#play').onclick=startGame;document.querySelector('#again').onclick=()=>show('start');
    document.querySelector('#name').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
  </script>
</body>
</html>
