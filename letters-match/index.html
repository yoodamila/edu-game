<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasangkan Huruf Kecil Besar</title>
<style>
*{box-sizing:border-box;font-family:Arial Rounded MT Bold,Arial,sans-serif}
body{
margin:0;min-height:100vh;
background:
linear-gradient(to right,#F9692A 0 50%,#ED42DE 50% 100%),
linear-gradient(to right,#B4C8FF 0 50%,#C6E201 50% 100%);
background-size:100% 50%,100% 50%;
background-position:top,bottom;
background-repeat:no-repeat;
display:flex;align-items:center;justify-content:center;
color:#17151d
}
.app{
width:min(95%,700px);background:#fff9f5;
border:4px solid #17151d;border-radius:32px;
box-shadow:8px 8px 0 #17151d;padding:22px;text-align:center
}
h1{font-size:42px;margin:10px 0}
button{
border:3px solid #17151d;border-radius:18px;
box-shadow:4px 4px 0 #17151d;
font-weight:bold;cursor:pointer
}
.play{padding:15px 35px;background:#F9692A;color:white;font-size:22px}
.info{display:flex;justify-content:space-around;font-size:20px;margin:15px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
height:70px;border:3px solid #17151d;border-radius:20px;
font-size:38px;background:#B4C8FF;
box-shadow:4px 4px 0 #17151d;
display:flex;align-items:center;justify-content:center;
cursor:pointer;transition:.2s
}
.right .card{background:#ED42DE;color:white}
.card.selected{background:#C6E201!important;transform:scale(1.08)}
.card.pop{animation:pop .4s forwards}
@keyframes pop{to{transform:scale(0);opacity:0}}
.level{font-size:24px;font-weight:bold}
.msg{min-height:35px;font-size:22px;margin:15px}
@media(max-width:500px){h1{font-size:32px}.card{height:60px;font-size:30px}}
</style>
</head>
<body>
<div class="app">
<div id="home">
<h1>🔤 Pasangan Huruf<br>Kecil-Besar</h1>
<p style="font-size:22px;font-weight:bold">Masukkan nama kamu 😊</p>
<input id="playerName" placeholder="Nama anak"
style="padding:14px;border:3px solid #17151d;border-radius:18px;font-size:20px;width:80%;margin:10px">
<br>
<button class="play" onclick="playGame()">▶ Play</button>

</div>

<div id="levelPage" style="display:none">
<h1>📚 Pilih Level</h1>
<div id="levels" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div>
</div>

<div id="game" style="display:none">
<div class="level">Level <span id="level">1</span>/20</div>
<div class="info"><span>⭐ <span id="score">0</span></span></div>
<div class="board">
<div id="small"></div>
<div id="big" class="right"></div>
</div>
<div class="msg" id="msg">Pilih huruf kecil dulu 😊</div>
<button class="play" style="background:#B4C8FF;color:#17151d" onclick="showLevels()">↩ Return</button><br><br><button class="play" onclick="start()">🔄 Mulai Lagi</button>
</div>
</div>

<script>
let level=1,score=0,selected=null;
let playerName="";
let savedLevel=1;
let savedScore=0;

function saveProgress(){
 localStorage.setItem("hurufProgress", JSON.stringify({
  name:playerName,
  level:level,
  score:score
 }));
}

function returnGame(){
 let data=JSON.parse(localStorage.getItem("hurufProgress")||"null");
 if(data){
  playerName=data.name||"Anak";
  level=data.level||1;
  score=data.score||0;
  document.getElementById("playerName").value=playerName;
  document.getElementById("level").textContent=level;
  document.getElementById("score").textContent=score;
saveProgress();
  document.getElementById("home").style.display="none";
  document.getElementById("game").style.display="block";
  start();
 }else{
  alert("Belum ada permainan tersimpan 😊");
 }
}
const letters="abcdefghijklmnopqrstuvwxyz";

function shuffle(a){return a.sort(()=>Math.random()-0.5)}

function playGame(){
playerName=document.getElementById("playerName").value || "Anak";
document.getElementById("home").style.display="none";
document.getElementById("game").style.display="block";
saveProgress();
start();
}


function showLevels(){
 document.getElementById("game").style.display="none";
 document.getElementById("home").style.display="none";
 document.getElementById("levelPage").style.display="block";
 let box=document.getElementById("levels");
 box.innerHTML="";
 for(let i=1;i<=20;i++){
  let b=document.createElement("button");
  b.className="play";
  b.style.padding="12px";
  b.style.fontSize="18px";
  b.textContent="Level "+i;
  b.onclick=()=>{level=i;document.getElementById("level").textContent=level;document.getElementById("levelPage").style.display="none";document.getElementById("game").style.display="block";start();}
  box.appendChild(b);
 }
}

function start(){
selected=null;
let count=Math.min(3+Math.floor((level-1)/2),10);
let arr=shuffle([...letters]).slice(0,count);
let s=shuffle([...arr]);
let b=shuffle(arr.map(x=>x.toUpperCase()));
small.innerHTML="";big.innerHTML="";
s.forEach(x=>{
 let c=document.createElement("button");
 c.className="card";c.textContent=x;c.dataset.v=x;
 c.onclick=()=>pickSmall(c);small.appendChild(c)
});
b.forEach(x=>{
 let c=document.createElement("button");
 c.className="card";c.textContent=x;c.dataset.v=x.toLowerCase();
 c.onclick=()=>pickBig(c);big.appendChild(c)
});
msg.textContent="Pilih huruf kecil dulu 😊";
}

function pickSmall(c){
document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));
selected=c;c.classList.add("selected");
msg.textContent="Cari huruf besarnya ✨";
}

function pickBig(c){
if(!selected){msg.textContent="Pilih huruf kecil dulu";return}
if(selected.dataset.v==c.dataset.v){
selected.classList.add("pop");c.classList.add("pop");
score++;document.getElementById("score").textContent=score;
saveProgress();
msg.textContent="Benar! 🎉";
setTimeout(()=>{
selected.remove();c.remove();selected=null;
if(document.querySelectorAll(".card").length==0){
 if(level<20){level++;document.getElementById("level").textContent=level;saveProgress()}
 else{msg.textContent="Hebat! Semua level selesai 🏆";level=1}
 setTimeout(start,700)
}},400)
}else{
msg.textContent="Coba lagi 🌈";
selected.classList.remove("selected");selected=null;
}
}
start();
</script>
</body>
</html>
